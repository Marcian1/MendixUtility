<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Profiler – Mockup</title>
<style>
/* Atlas UI tokens (Mendix default theme) */
:root{
  --brand-primary:#264AE5; --brand-success:#3CB33D; --brand-warning:#F99B1D; --brand-danger:#E33F4E; --brand-info:#0B8FD8;
  --gray-darker:#0A1325; --gray-dark:#3B4252; --gray:#6C7180; --gray-light:#CED0D3; --gray-lighter:#E7E8EA; --gray-lightest:#F5F6F6; --bg:#F8F8F8;
  --radius:4px; --font:"Open Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 var(--font);color:var(--gray-darker);background:var(--bg)}
.topbar{background:var(--gray-darker);color:#fff;height:56px;display:flex;align-items:center;padding:0 20px;gap:12px}
.topbar b{font-size:16px}.topbar small{color:var(--gray-light)}
.content{padding:24px;max-width:1200px;margin:0 auto}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--gray);margin:0 0 16px}
.card{background:#fff;border:1px solid var(--gray-lighter);border-radius:var(--radius);padding:16px}
.form-control{height:34px;padding:0 10px;border:1px solid var(--gray-light);border-radius:var(--radius);font:inherit;background:#fff}
.form-control:focus{outline:2px solid var(--brand-primary);outline-offset:-1px;border-color:var(--brand-primary)}
.filters{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.filters input{flex:1;min-width:200px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;color:#fff}
.b-success{background:var(--brand-success)}.b-warning{background:var(--brand-warning)}.b-danger{background:var(--brand-danger)}
.b-flow{background:var(--brand-primary)}.b-action{background:var(--brand-info)}.b-java{background:var(--gray)}
table{width:100%;border-collapse:collapse}
th{background:var(--gray-lightest);text-align:left;font-size:12px;color:var(--gray-dark);padding:10px 12px;border-bottom:2px solid var(--gray-lighter);cursor:pointer;user-select:none;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--gray-lighter)}
tr.main{cursor:pointer}tr.main:hover{background:#EEF1FD}tr.main.open{background:#EEF1FD}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:Consolas,monospace;font-size:13px}
.caret{display:inline-block;width:14px;color:var(--gray);transition:transform .15s}.open .caret{transform:rotate(90deg)}
tr.detail>td{padding:0;background:var(--gray-lightest)}
.logs{padding:8px 12px 12px 38px}
.log{display:grid;grid-template-columns:70px 60px 1fr 90px;gap:10px;padding:4px 8px;border-bottom:1px solid var(--gray-lighter);align-items:center}
.log:last-child{border:0}.log.head{color:var(--gray);font-size:12px;font-weight:600}
.lvl{font-size:11px;font-weight:700}.INFO{color:var(--brand-info)}.WARN{color:var(--brand-warning)}.ERROR{color:var(--brand-danger)}.TRACE{color:var(--gray)}
.log .bar{height:6px;background:var(--gray-lighter);border-radius:3px;margin-top:3px}.log .bar i{display:block;height:100%;background:var(--brand-primary);border-radius:3px}
.pager{display:flex;justify-content:space-between;align-items:center;padding-top:12px;color:var(--gray)}
.btn{height:34px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--gray-light);background:#fff;font:inherit;cursor:pointer}.btn:hover{background:var(--gray-lightest)}
</style>
</head>
<body>
<div class="topbar"><b>⏱ Flow Profiler</b><small>MendixUtility</small></div>
<main class="content">
  <h2>Executions</h2>
  <p class="sub">Every flow and action that ran. Click a row to see its log breakdown.</p>
  <div class="card">
    <div class="filters">
      <input id="q" class="form-control" placeholder="Search by name…">
      <select id="type" class="form-control"><option value="">All types</option><option>Microflow</option><option>Nanoflow</option><option>Java action</option><option>Scheduled event</option></select>
    </div>
    <table><thead><tr>
      <th></th><th data-s="t">Started</th><th data-s="name">Name</th><th data-s="kind">Type</th><th class="num" data-s="s">Execution time (s) ▾</th></tr></thead>
      <tbody id="rows"></tbody></table>
    <div class="pager"><span id="count"></span><span><button class="btn" id="prev">‹ Previous</button> <button class="btn" id="next">Next ›</button></span></div>
  </div>
</main>

<script>
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const items=[["Orders.ACT_Order_Submit","Microflow",.9],["Orders.DS_Order_Overview","Microflow",.2],["Orders.SUB_Order_Calculate","Microflow",.4],["Customers.ACT_Customer_Import","Microflow",6.5],["Customers.DS_Customer_Search","Nanoflow",.1],["FolderCreator.ACT_CreateFolders","Microflow",2.2],["Admin.SE_Cleanup_OldData","Scheduled event",24],["Admin.ACT_Report_Generate","Microflow",11],["Integration.REST_GetInvoices","Microflow",3.4],["Commons.JA_HashPassword","Java action",.35],["Commons.JA_SendEmail","Java action",1.8],["Orders.NAV_OpenOrder","Nanoflow",.05]];
const now=Date.now(),data=[];
for(let i=0;i<120;i++){const f=items[Math.floor(rnd()*items.length)];
  data.push({id:i,t:now-rnd()*86400000,name:f[0],kind:f[1],s:+(f[2]*(.4+rnd()*1.6)*(rnd()>.93?3:1)).toFixed(2)});}
const $=s=>document.querySelector(s);
const fmt=t=>new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
const kcls={Microflow:"b-flow",Nanoflow:"b-action","Java action":"b-java","Scheduled event":"b-warning"};
const scls=s=>s>5?"b-danger":s>1?"b-warning":"b-success";

const S={page:0,size:12,sort:"s",dir:-1,open:null};

function logsFor(d){ // fake breakdown, sums to roughly d.s
  const steps=[["MicroflowEngine","INFO","Start "+d.name,0],["ConnectionBus_Queries","TRACE","SELECT FROM Orders.Order WHERE …",.12],["MicroflowEngine","TRACE","Retrieve from database (Order)",.1],["MicroflowEngine","TRACE","Loop over OrderLines (14 iterations)",.35],["ConnectionBus_Queries","TRACE","UPDATE Orders.OrderLine SET …",.15],["REST Client","INFO","GET https://api.example.com/rates → 200",.2],["MicroflowEngine","TRACE","Commit Order",.07],["MicroflowEngine","INFO","End "+d.name,.01]];
  if(d.s>5)steps.splice(3,0,["MicroflowEngine","WARN","Slow activity: Retrieve exceeded 2 s",.05]);
  return steps.map(([src,lvl,msg,w],i)=>({src,lvl,msg,s:+(d.s*w).toFixed(2),off:+(steps.slice(0,i).reduce((a,x)=>a+x[3],0)*d.s).toFixed(2)}));
}

function render(){
  const q=$("#q").value.toLowerCase(),ty=$("#type").value;
  const f=data.filter(d=>d.name.toLowerCase().includes(q)&&(!ty||d.kind===ty)).sort((a,b)=>(a[S.sort]>b[S.sort]?1:-1)*S.dir);
  const max=Math.ceil(f.length/S.size)||1;S.page=Math.min(S.page,max-1);
  $("#rows").innerHTML=f.slice(S.page*S.size,(S.page+1)*S.size).map(d=>{
    const open=S.open===d.id;
    let h=`<tr class="main ${open?"open":""}" data-id="${d.id}"><td><span class="caret">▶</span></td><td>${fmt(d.t)}</td><td class="mono">${d.name}</td><td><span class="badge ${kcls[d.kind]}">${d.kind}</span></td><td class="num"><span class="badge ${scls(d.s)}">${d.s.toFixed(2)} s</span></td></tr>`;
    if(open){const L=logsFor(d);
      h+=`<tr class="detail"><td colspan="5"><div class="logs"><div class="log head"><span>At (s)</span><span>Level</span><span>Log</span><span style="text-align:right">Took (s)</span></div>`+
      L.map(l=>`<div class="log"><span class="mono">+${l.off.toFixed(2)}</span><span class="lvl ${l.lvl}">${l.lvl}</span><span><span class="mono">${l.msg}</span> <small style="color:var(--gray)">${l.src}</small><div class="bar"><i style="width:${Math.min(100,l.s/d.s*100)}%"></i></div></span><span class="mono" style="text-align:right">${l.s.toFixed(2)}</span></div>`).join("")+`</div></td></tr>`;}
    return h;}).join("")||`<tr><td colspan="5" style="text-align:center;color:var(--gray);padding:30px">Nothing found</td></tr>`;
  $("#count").textContent=`${f.length} executions · page ${S.page+1} of ${max}`;
  document.querySelectorAll("tr.main").forEach(r=>r.onclick=()=>{S.open=S.open===+r.dataset.id?null:+r.dataset.id;render();});
}
$("#q").oninput=()=>{S.page=0;render()};$("#type").onchange=()=>{S.page=0;render()};
$("#prev").onclick=()=>{S.page=Math.max(0,S.page-1);render()};$("#next").onclick=()=>{S.page++;render()};
document.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{S.dir=S.sort===th.dataset.s?-S.dir:-1;S.sort=th.dataset.s;render()});
render();
</script>
</body>
</html>
